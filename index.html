<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#193c31" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="タンレン" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>タンレン</title>
  </head>
  <body>
    <header class="global-header"><a id="homeLink" href="#record"><strong>タンレン</strong><span>日々を積み上げる記録</span></a></header>
    <main class="app-shell">
      <div class="record-date"><label for="datePicker">記録日</label><input id="datePicker" class="date-button" type="date" aria-label="表示する日付を選ぶ" /></div>

      <section class="quick-actions" aria-label="新しい記録">
        <h2>記録する</h2>
        <div class="action-grid">
          <button class="action-card meal" data-action="meal" data-meal-type="朝食"><span>朝</span>朝食</button>
          <button class="action-card meal" data-action="meal" data-meal-type="昼食"><span>昼</span>昼食</button>
          <button class="action-card meal" data-action="meal" data-meal-type="夕食"><span>夜</span>夕食</button>
          <button class="action-card meal" data-action="meal" data-meal-type="間食"><span>間</span>間食</button>
          <button class="action-card workout" data-action="workout"><span>＋</span>トレーニング</button>
        </div>
      </section>

      <section class="daily-log" aria-labelledby="daily-log-heading">
        <div class="section-heading">
          <h2 id="daily-log-heading">この日の記録</h2>
          <span id="recordCount" class="count-pill"></span>
        </div>
        <div id="records" class="records"></div>
      </section>
      <button id="connectSheetsButton" class="history-link" type="button">Googleスプレッドシートに接続する</button>
      <button id="loadSheetsButton" class="history-link" type="button" hidden>シートから読み込む</button>
      <p id="sheetsStatus" class="sync-status" aria-live="polite"></p>
      <button id="showHistoryButton" class="history-link" type="button">トレーニング履歴を見る</button>
      <button id="showMealHistoryButton" class="history-link" type="button">食事履歴を見る</button>
    </main>

    <main id="historyView" class="app-shell history-view" hidden>
      <section class="history-section first-history" aria-labelledby="todayTrainingHeading">
        <h1>トレーニング履歴</h1>
        <h2 id="todayTrainingHeading">今日のトレーニング</h2>
        <div id="todayTraining" class="training-history"></div>
      </section>
      <section class="history-section" aria-labelledby="recentTrainingHeading">
        <h2 id="recentTrainingHeading">最近30日のトレーニング</h2>
        <div id="recentTraining" class="training-history"></div>
      </section>
    </main>

    <main id="mealHistoryView" class="app-shell history-view" hidden>
      <section class="history-section first-history" aria-labelledby="todayMealHeading">
        <h1>食事履歴</h1>
        <h2 id="todayMealHeading">今日の食事</h2>
        <div id="todayMeals" class="training-history"></div>
      </section>
      <section class="history-section" aria-labelledby="recentMealHeading">
        <h2 id="recentMealHeading">最近30日の食事</h2>
        <div id="recentMeals" class="training-history"></div>
      </section>
    </main>

    <dialog id="mealDialog" class="sheet-dialog">
      <form method="dialog" class="sheet" id="mealForm">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <h2 id="mealDialogTitle">食事を記録</h2>
          <button class="icon-button" type="button" data-close="mealDialog" aria-label="閉じる">×</button>
        </div>
        <input id="mealId" type="hidden" />
        <label>食事区分
          <select id="mealType">
            <option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option>
          </select>
        </label>
        <label>摂取時刻
          <input id="mealTime" type="time" required />
        </label>
        <div>
          <p class="label">よく食べるもの</p>
          <div id="foodSuggestions" class="chip-list"></div>
          <button id="moreFoodsButton" class="more-button" type="button" hidden>もっと見る</button>
        </div>
        <label>食品・料理を追加
          <div class="input-with-button">
            <input id="foodInput" type="text" autocomplete="off" placeholder="例：プロテイン" />
            <button type="button" id="addFoodButton" class="secondary-button">追加</button>
          </div>
        </label>
        <div id="selectedFoods" class="selected-list"></div>
        <div class="form-actions"><button type="button" id="deleteMealButton" class="text-button danger" hidden>この食事を削除</button><button type="submit" class="primary-button">食事を保存</button></div>
      </form>
    </dialog>

    <dialog id="workoutDialog" class="sheet-dialog">
      <form method="dialog" class="sheet" id="workoutForm">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <h2 id="workoutDialogTitle">トレーニングを記録</h2>
          <button class="icon-button" type="button" data-close="workoutDialog" aria-label="閉じる">×</button>
        </div>
        <input id="workoutEditId" type="hidden" />
        <label>実施時刻
          <input id="workoutTime" type="time" required />
        </label>
        <p class="label">種目を追加</p>
        <div id="workoutSuggestions" class="workout-options"></div>
        <button id="moreExercisesButton" class="more-button" type="button" hidden>もっと見る</button>
        <div class="custom-exercise">
          <p class="label">新しい種目を追加</p>
          <div class="custom-exercise-fields">
            <input id="customExerciseName" type="text" autocomplete="off" placeholder="例：ランニング" />
            <input id="customExerciseAmount" type="number" inputmode="decimal" min="0" step="0.1" placeholder="量" />
            <select id="customExerciseUnit" aria-label="単位"><option>回</option><option>秒</option><option>km</option></select>
            <input id="customExerciseSets" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="セット数" />
            <button type="button" id="addExerciseButton" class="secondary-button">追加</button>
          </div>
        </div>
        <div id="selectedExercises" class="selected-list"></div>
        <div class="form-actions"><button type="button" id="deleteWorkoutButton" class="text-button danger" hidden>このトレーニングを削除</button><button type="submit" class="primary-button">トレーニングを保存</button></div>
      </form>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state"><p>まだ記録がありません。</p><small>食事かトレーニングを記録して、今日を積み上げましょう。</small></div>
    </template>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="./app-v16.js"></script>
  </body>
</html>
